<h1>Exercício 3 - Login com Signals e Service</h1>

<form (submit)="loginService.fazerLogin(); $event.preventDefault()">

  <label>Usuário:</label>
  <input
    type="text"
    (input)="loginService.atualizarUsuario($event)"
  >

  <br><br>

  <label>Senha:</label>
  <input
    type="password"
    (input)="loginService.atualizarSenha($event)"
  >

  <br><br>

  <button type="submit">
    Entrar
  </button>

</form>

<p>
  {{ loginService.logado() ? 'O usuário está logado' : 'O usuário não está logado' }}
</p>
