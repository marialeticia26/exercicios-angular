<h1>Atualizar Post</h1>

<form (submit)="atualizarPost($event)">

  <div>
    <label for="id">ID do Post:</label>
    <input
      type="number"
      id="id"
      name="id"
      placeholder="Digite o ID do post"
    >
  </div>

  <div>
    <label for="userId">Usuário:</label>
    <input
      type="number"
      id="userId"
      name="userId"
      placeholder="Digite o ID do usuário"
    >
  </div>

  <div>
    <label for="title">Título:</label>
    <input
      type="text"
      id="title"
      name="title"
      placeholder="Digite o novo título"
    >
  </div>

  <div>
    <label for="body">Conteúdo:</label>
    <textarea
      id="body"
      name="body"
      placeholder="Digite o novo conteúdo"
    ></textarea>
  </div>

  <button type="submit">
    Atualizar
  </button>

</form>
